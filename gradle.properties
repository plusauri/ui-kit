kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# -Dapple.awt.UIElement=true keeps a daemon that touches AWT from registering as a foreground macOS app.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dapple.awt.UIElement=true
# Wasm linking needs the headroom.
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dapple.awt.UIElement=true
