# The kit's tests and the wasm compile, on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: jvmTest + compileKotlinWasmJs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: jvmTest + compileKotlinWasmJs
        run: ./gradlew --continue jvmTest compileKotlinWasmJs

      # Gradle's console names a failing test, not its message. Print each failure from the
      # JUnit XML instead of uploading reports.
      - name: Print test failures
        if: failure()
        run: |
          find build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -l '<failure' 2>/dev/null \
            | while read -r f; do
                echo "::group::$f"
                grep -A20 '<failure' "$f" | head -60
                echo "::endgroup::"
              done || true
