# The kit standing on its own: its tests and the wasm compile, on every push and pull request.
# Until this existed the kit's tests ran only inside Tutilis's jvmSweep.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: jvmTest + compileKotlinWasmJs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The build applies com.android.library, and AGP wants an SDK at configuration time even
      # for jvm and wasm tasks. Do not request the obsolete `tools` package
      # (android-actions/setup-android#537).
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: jvmTest + compileKotlinWasmJs
        run: ./gradlew --continue jvmTest compileKotlinWasmJs

      # Gradle's console names a failing test, not its message. Print each failure from the
      # JUnit XML instead of uploading reports.
      - name: Print test failures
        if: failure()
        run: |
          find build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -l '<failure' 2>/dev/null \
            | while read -r f; do
                echo "::group::$f"
                grep -A20 '<failure' "$f" | head -60
                echo "::endgroup::"
              done || true
