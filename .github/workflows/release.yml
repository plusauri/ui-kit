# A release: push a tag `v<version>` on a commit whose build.gradle.kts says that version.
# Publishes every target (jvm, wasmJs, iosArm64, iosSimulatorArm64, android) to GitHub Packages,
# https://github.com/orgs/plusauri/packages. A published version is never republished: GitHub
# Packages refuses the same version twice, so a fix is the next version.
#
# macOS, because the iOS klibs are built on a Mac.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the build's version
        run: |
          set -euo pipefail
          built="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle.kts version \"$built\""
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew jvmTest
      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
