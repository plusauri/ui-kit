# A release: push a tag `v<version>` on a commit whose build.gradle.kts says that version.
# Publishes every target (jvm, wasmJs, iosArm64, iosSimulatorArm64, android) to Maven Central as
# com.plusauri:ui-kit, signed.
#
# The Central upload stops at "validated" in the Central Portal (central.sonatype.com →
# Deployments): a person presses Publish there, or Drop. A version published on Central is
# permanent, so a fix is always the next version.
#
# Run by hand (Actions → Release → Run workflow) it is a dry run: the Central upload only, for the
# version the chosen branch's build says, to be inspected in the Portal and dropped (not
# published: Publish there makes it permanent).
#
# Actions are pinned to commit SHAs (Dependabot keeps them current), since this job holds the
# signing key.
#
# Secrets, in the `release` environment only: MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (a Central
# Portal user token) and SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_PASSWORD (the release key,
# "Plusauri Releases", fingerprint 1D3AD54F1509F3748C778A7937E2D16D15C4D9F8, on keyserver.ubuntu.com).
#
# The `release` environment needs a maintainer's approval before the job starts, and only a `v*`
# tag or `main` may use it. Only admins may create, move or delete a `v*` tag (a tag ruleset).
#
# macOS, because the iOS klibs are built on a Mac.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dry run to Central' || format('Publish {0}', github.ref_name) }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the build's version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          built="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle.kts version \"$built\""
            exit 1
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test
        run: ./gradlew jvmTest
      # The secrets reach this step only, not the tests above.
      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral
